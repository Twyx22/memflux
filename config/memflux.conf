# memflux — configuration du démon (INIsimple, rechargé au SIGHUP)
[engine]
interval_ms = 1000
# Pression PSI mémoire (fraction 0..1) déclenchant le mode agressif
psi_threshold = 0.20
# Seuil de pression "calme"
psi_low = 0.05
# Score minimal pour qu'un processus soit éligible au pageout
min_score = 3.0
# Taille min (Mo) d'anonymous réclamable pour cibler un processus
min_reclaimable_mb = 64
# Nombre max de cibles traitées par cycle
max_targets = 3
# Mo réclamés max par processus et par cycle
max_reclaim_mb_per_cycle = 512
# Protection du cache disque : on ne pageout que si anon > free*anon_ratio_cap
anon_ratio_cap = 0.60
# Activer le trim du heap des gros processus malloc (madvise(MADV_DONTNEED))
enable_heap_trim = true
# Tenter le reclaim cgroup (memory.reclaim) quand PSI élevé
enable_cgroup_reclaim = true
# Activer KSM si disponible
enable_ksm = true

[ksm]
sleep_millisecs = 200
pages_to_scan = 2000
merge_across_nodes = 1

[preload]
# Seuils d'auto-trim pour les apps lancées avec memflux-preload
trim_after_mb = 512
free_bytes = 268435456

[log]
level = info